name: PC sender tests

on:
  push:
    paths:
      - 'pc-sender/**'
      - 'castmirror.config.json'
      - '.github/workflows/sender.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pc-sender
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: npm ci

      - run: npm test
